<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f5f6ef"/><text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17352a">HOW TO READ A TORTOISE CARE ANSWER</text><g font-family="Arial,sans-serif"><rect x="80" y="150" width="300" height="280" rx="18" fill="#fff" stroke="#cbd6cd" stroke-width="3"/><text x="230" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#647b6d">01 · ANSWER</text><text x="230" y="265" text-anchor="middle" font-size="25" font-weight="700" fill="#17352a">What should I do?</text><text x="230" y="320" text-anchor="middle" font-size="15" fill="#5e6c64">The practical conclusion</text><text x="230" y="346" text-anchor="middle" font-size="15" fill="#5e6c64">comes first.</text><rect x="450" y="150" width="300" height="280" rx="18" fill="#fff" stroke="#cbd6cd" stroke-width="3"/><text x="600" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#647b6d">02 · LIMITS</text><text x="600" y="265" text-anchor="middle" font-size="25" font-weight="700" fill="#17352a">How certain is it?</text><text x="600" y="320" text-anchor="middle" font-size="15" fill="#5e6c64">Species, study design and</text><text x="600" y="346" text-anchor="middle" font-size="15" fill="#5e6c64">evidence gaps stay visible.</text><rect x="820" y="150" width="300" height="280" rx="18" fill="#eef4ee" stroke="#9fb6a5" stroke-width="3"/><text x="970" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#1d6245">03 · VERIFY</text><text x="970" y="265" text-anchor="middle" font-size="25" font-weight="700" fill="#17352a">Can I check it?</text><text x="970" y="320" text-anchor="middle" font-size="15" fill="#5e6c64">Primary sources and</text><text x="970" y="346" text-anchor="middle" font-size="15" fill="#5e6c64">source limits are linked.</text></g><path d="M380 290h70M750 290h70" stroke="#7d9c86" stroke-width="6"/><text x="600" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#64736b">A professional reference site should make the conclusion, uncertainty and evidence trace visible without forcing the reader to hunt.</text></svg>