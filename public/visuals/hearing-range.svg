<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420"><rect width="900" height="420" fill="#f7f6ef"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#17352a">HEARING: A DIFFERENT FREQUENCY WORLD</text><line x1="130" y1="310" x2="770" y2="310" stroke="#52665a" stroke-width="3"/><path d="M150 280 Q330 150 500 245 T760 215" fill="none" stroke="#1d6245" stroke-width="7"/><text x="145" y="345" font-family="Arial" font-size="13" fill="#64736b">LOWER FREQUENCY</text><text x="690" y="345" font-family="Arial" font-size="13" fill="#64736b">HIGHER FREQUENCY</text><text x="450" y="150" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#17352a">comparative chelonian sensitivity</text><text x="450" y="185" text-anchor="middle" font-family="Arial" font-size="13" fill="#64736b">Conceptual profile — not an audiogram for every species.</text><rect x="250" y="365" width="400" height="24" rx="12" fill="#dce8dd"/><text x="450" y="382" text-anchor="middle" font-family="Arial" font-size="11" fill="#52665a">sound + vibration are different cues</text></svg>