<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420"><rect width="900" height="420" fill="#f7f6ef"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#17352a">HYDRATION IS A SYSTEM</text><g font-family="Arial"><rect x="60" y="150" width="180" height="100" rx="12" fill="white" stroke="#cbd6cd" stroke-width="3"/><text x="150" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#17352a">DRINKING WATER</text><text x="150" y="220" text-anchor="middle" font-size="12" fill="#64736b">continuous access</text><rect x="270" y="150" width="180" height="100" rx="12" fill="white" stroke="#cbd6cd" stroke-width="3"/><text x="360" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#17352a">MICROCLIMATE</text><text x="360" y="220" text-anchor="middle" font-size="12" fill="#64736b">humidity + refuge</text><rect x="480" y="150" width="180" height="100" rx="12" fill="white" stroke="#cbd6cd" stroke-width="3"/><text x="570" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#17352a">TEMPERATURE</text><text x="570" y="220" text-anchor="middle" font-size="12" fill="#64736b">thermoregulation</text><rect x="690" y="150" width="150" height="100" rx="12" fill="#eef4ee" stroke="#9fb6a5" stroke-width="3"/><text x="765" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#17352a">HEALTH</text><text x="765" y="220" text-anchor="middle" font-size="12" fill="#64736b">monitor change</text></g><path d="M240 200h30M450 200h30M660 200h30" stroke="#789a82" stroke-width="5"/><text x="450" y="325" text-anchor="middle" font-family="Arial" font-size="16" fill="#64736b">Soaking is a tool — not a substitute for fixing the environment or investigating illness.</text></svg>